name: Update RSS json feed

on:
  schedule:
    - cron: '*/31 * * * *'  # every 31 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Generate RSS json
        run: |
          python scraper/rsstojson.py

      - name: Commit and push changes
        run: |
          git config user.name "Bikal Barai Magar"
          git config user.email "mbikal@users.noreply.github.com"
          git add rss/rss_feed.json
          git commit -m "Update RSS json feed" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main

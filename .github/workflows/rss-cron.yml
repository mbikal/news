name: Generate RSS Feed (Cron)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check before running scraper
        run: |
          echo "Before scraper:"
          ls -la rss/ || echo "rss directory doesn't exist yet"
          if [ -f rss/rss.xml ]; then
            echo "Current RSS file size: $(wc -c < rss/rss.xml) bytes"
            echo "Last modified: $(stat -c '%y' rss/rss.xml)"
          fi
      
      - name: Run scraper and generate RSS
        run: |
          mkdir -p rss
          python main.py
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "ERROR: Python script failed with exit code $exit_code"
            exit $exit_code
          fi
      
      - name: Check after running scraper
        run: |
          echo "After scraper:"
          ls -la rss/
          if [ -f rss/rss.xml ]; then
            echo "New RSS file size: $(wc -c < rss/rss.xml) bytes"
            echo "First 10 lines:"
            head -10 rss/rss.xml
          else
            echo "ERROR: rss.xml was not created!"
            exit 1
          fi
      
      - name: Commit and push RSS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main
          
          git add rss/rss.xml
          
          if git diff --cached --quiet; then
            echo "✓ No RSS changes detected (file content is identical)"
          else
            echo "✓ RSS changes detected, committing..."
            git commit -m "Update RSS feed - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin main
            git push origin main
            echo "✓ Successfully pushed changes"
          fi
